version: "3.9"

services:
  # ===== 数据库 =====
  postgres:
    image: postgres:16-alpine
    container_name: multimodal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-multimodal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-multimodal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-multimodal}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multimodal

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    container_name: multimodal-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multimodal

  # ===== Elasticsearch =====
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: multimodal-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-changeme}
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - cluster.name=multimodal-cluster
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -u elastic:${ELASTICSEARCH_PASSWORD:-changeme} http://localhost:9200/_cluster/health | grep -q '\"status\"'"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - multimodal

  # ===== MinIO =====
  minio:
    image: minio/minio:latest
    container_name: multimodal-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - multimodal

  # ===== MinIO Bucket 初始化 =====
  minio-init:
    image: minio/mc:latest
    container_name: multimodal-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb -p local/${MINIO_BUCKET:-multimodal};
      mc anonymous set download local/${MINIO_BUCKET:-multimodal};
      echo 'MinIO bucket initialized';
      "
    networks:
      - multimodal

  # ===== 后端（本地开发时直接宿主机运行，部署时用 --profile docker 启用） =====
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multimodal-backend
    restart: unless-stopped
    profiles:
      - docker
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ELASTICSEARCH_HOST: elasticsearch
      MINIO_HOST: minio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    networks:
      - multimodal

  # ===== Celery Worker（本地开发时直接宿主机运行，部署时用 --profile docker 启用） =====
  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: multimodal-celery
    restart: unless-stopped
    profiles:
      - docker
    command: celery -A app.core.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      ELASTICSEARCH_HOST: elasticsearch
      MINIO_HOST: minio
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - multimodal

  # ===== 前端 =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: multimodal-frontend
    restart: unless-stopped
    networks:
      - multimodal

  # ===== Nginx 反向代理 =====
  nginx:
    image: nginx:alpine
    container_name: multimodal-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    networks:
      - multimodal

volumes:
  postgres_data:
  redis_data:
  es_data:
  minio_data:

networks:
  multimodal:
    driver: bridge
